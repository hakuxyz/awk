[package]
name = "awk"
version = "0.1.2"
edition = "2024"
description = "A fast POSIX awk implementation in Rust"
license = "MIT"
repository = "https://github.com/hakuxyz/awk"
readme = "README.md"
keywords = ["awk", "text", "filter", "cli", "posix"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.88"

[dependencies]
regex = "1"

[[bin]]
name = "awk"
path = "src/main.rs"

[lib]
name = "awk"
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock", "std"]
