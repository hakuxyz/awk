<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="878" height="390" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <rect x="1" y="1" width="878" height="44" rx="14" fill="#21262d"/>
  <rect x="1" y="30" width="878" height="16" fill="#21262d"/>
  <circle cx="28" cy="23" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="23" r="7" fill="#febc2e"/>
  <circle cx="76" cy="23" r="7" fill="#28c840"/>
  <text x="440" y="28" fill="#8b949e" font-size="14" text-anchor="middle">awk 0.1.0</text>

  <g font-size="15">
    <text x="26" y="86" fill="#3fb950">$ <tspan fill="#e6edf3">echo "hello world" | awk '{print $2}'</tspan></text>
    <text x="26" y="114" fill="#79c0ff">world</text>

    <text x="26" y="152" fill="#3fb950">$ <tspan fill="#e6edf3">seq 1 100 | awk '{ s += $1 } END { printf "sum = %d\n", s }'</tspan></text>
    <text x="26" y="180" fill="#79c0ff">sum = 5050</text>

    <text x="26" y="218" fill="#3fb950">$ <tspan fill="#e6edf3">printf 'apple,3\nbanana,5\n' | awk -F, '{ t += $2 } END { print t }'</tspan></text>
    <text x="26" y="246" fill="#79c0ff">8</text>

    <text x="26" y="284" fill="#3fb950">$ <tspan fill="#e6edf3">printf 'a1b22c' | awk -F'[0-9]+' '{ print NF, $2 }'</tspan></text>
    <text x="26" y="312" fill="#79c0ff">3 b</text>

    <text x="26" y="350" fill="#3fb950">$ <tspan fill="#e6edf3">awk 'BEGIN { print gensub(/(.)(.)/, "[\\2\\1]", "g", "abcd") }'</tspan></text>
    <text x="26" y="378" fill="#79c0ff">[ba][dc]</text>
  </g>
</svg>
