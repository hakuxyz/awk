<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#30363d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="330" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="440" y="34" fill="#8b949e" font-size="14" text-anchor="middle">pipeline</text>

  <g font-size="15">
    <rect x="34" y="58" width="150" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="109" y="90" fill="#e6edf3" text-anchor="middle">lexer.rs</text>
    <text x="109" y="114" fill="#8b949e" font-size="12" text-anchor="middle">tokens + regex</text>

    <rect x="234" y="58" width="150" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="309" y="90" fill="#e6edf3" text-anchor="middle">parser.rs</text>
    <text x="309" y="114" fill="#8b949e" font-size="12" text-anchor="middle">recursive descent</text>

    <rect x="434" y="58" width="150" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="509" y="90" fill="#e6edf3" text-anchor="middle">ast.rs</text>
    <text x="509" y="114" fill="#8b949e" font-size="12" text-anchor="middle">rules + statements</text>

    <rect x="634" y="58" width="212" height="76" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <text x="740" y="90" fill="#e6edf3" text-anchor="middle">interp.rs</text>
    <text x="740" y="114" fill="#8b949e" font-size="12" text-anchor="middle">tree walk + builtins</text>
  </g>

  <g stroke="#30363d" stroke-width="2" marker-end="url(#arrow)">
    <line x1="184" y1="96" x2="228" y2="96"/>
    <line x1="384" y1="96" x2="428" y2="96"/>
    <line x1="584" y1="96" x2="628" y2="96"/>
  </g>

  <g font-size="13">
    <rect x="34" y="196" width="248" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="158" y="224" fill="#e6edf3" text-anchor="middle">value.rs</text>
    <text x="158" y="248" fill="#8b949e" text-anchor="middle">str / num / strnum</text>
    <text x="158" y="270" fill="#8b949e" text-anchor="middle">uninit / numval flags</text>
    <text x="158" y="292" fill="#8b949e" text-anchor="middle">POSIX comparison rules</text>

    <rect x="316" y="196" width="248" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="440" y="224" fill="#e6edf3" text-anchor="middle">regex crate</text>
    <text x="440" y="248" fill="#8b949e" text-anchor="middle">ERE matching and splitting</text>
    <text x="440" y="270" fill="#8b949e" text-anchor="middle">IGNORECASE via (?i)</text>
    <text x="440" y="292" fill="#8b949e" text-anchor="middle">capture groups for gensub</text>

    <rect x="598" y="196" width="248" height="98" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="722" y="224" fill="#e6edf3" text-anchor="middle">chrono + libc</text>
    <text x="722" y="248" fill="#8b949e" text-anchor="middle">strftime / mktime</text>
    <text x="722" y="270" fill="#8b949e" text-anchor="middle">DST aware conversions</text>
    <text x="722" y="292" fill="#8b949e" text-anchor="middle">zone names through tzset</text>
  </g>

  <g stroke="#30363d" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)">
    <line x1="740" y1="134" x2="740" y2="190"/>
    <line x1="700" y1="134" x2="560" y2="190"/>
    <line x1="660" y1="134" x2="270" y2="190"/>
  </g>
</svg>
